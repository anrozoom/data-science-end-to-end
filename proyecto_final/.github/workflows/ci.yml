# CI del proyecto final (proyecto_final/): en cada push y en cada pull request.
# Instala las dependencias, construye la imagen de la API, corre pytest y prueba la imagen construida.
# En CI no hay servidor de MLflow ni Snowflake: las pruebas usan el modelo exportado en tests/fixtures/.
# Copia idéntica en proyecto_final/.github/workflows/ci.yml (GitHub solo ejecuta los de la raíz).
name: ci

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto_final
    steps:
      - uses: actions/checkout@v4

      - name: Las copias de los workflows en la raíz y en proyecto_final son idénticas
        working-directory: .
        run: |
          diff -u .github/workflows/ci.yml proyecto_final/.github/workflows/ci.yml
          diff -u .github/workflows/cd.yml proyecto_final/.github/workflows/cd.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: proyecto_final/api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r api/requirements.txt pytest==8.3.3 httpx==0.27.2

      - name: Construir la imagen de la API
        run: docker build -t centinela-api:ci api

      - name: Pruebas (contrato, modelo, comportamiento y respaldo)
        run: pytest tests -v

      - name: Prueba de humo de la imagen construida
        run: |
          docker run -d --name api-ci -p 8000:8000 \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -e MODELO_URI=/fixtures/modelo_champion -e REGISTRO_SNOWFLAKE=false \
            centinela-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/salud && break; sleep 2; done
          curl -sf localhost:8000/salud | python -c "import json,sys; s=json.load(sys.stdin); assert s['modelo_cargado'] and not s['respaldo'], s"
          codigo=$(curl -s -o respuesta.json -w '%{http_code}' -X POST localhost:8000/predecir \
                     -H 'Content-Type: application/json' -d @docs/api/ejemplo_solicitud.json)
          cat respuesta.json; test "$codigo" = 200
          python -c "import json; r=json.load(open('respuesta.json')); assert r['decision'] in ('aprobar','verificar','retener') and r['version_modelo']"
          docker rm -f api-ci
